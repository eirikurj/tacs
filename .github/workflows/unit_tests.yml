name: Build, unit tests, and docs

# DEBUG workflow: locate the NaN in test_trans_beam's perturbed sinusoid solve on ubuntu-26.04.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,sm,tcp
      OMPI_MCA_rmaps_base_oversubscribe: 1
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    name: Debug trans_beam r${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          channels: conda-forge
          python-version: "3.11"
          conda-remove-defaults: true
      - name: Install TACS
        run: |
          export TACS_DIR=${GITHUB_WORKSPACE};
          echo "TACS_DIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV
          conda install -c conda-forge mamba -q -y;
          mamba install -c conda-forge pip;
          mamba install -c conda-forge sysroot_linux-64=2.17 -q -y;
          mamba install -c conda-forge openblas -q -y;
          mamba install -c conda-forge openmpi openmpi-mpicxx -q -y;
          mamba install -c conda-forge lapack -q -y;
          mamba install -c conda-forge metis=5.1.0 -q -y;
          cd $TACS_DIR;
          cp Makefile.in.info Makefile.in;
          make debug TACS_DIR=$TACS_DIR METIS_INCLUDE=-I${CONDA_PREFIX}/include/ METIS_LIB="-L${CONDA_PREFIX}/lib/ -lmetis" -j4;
          make interface;
          mamba install -c conda-forge "petsc>=3.19,!=3.22.3" petsc4py "numpy>=2" -q -y;
      - name: Rebuild with GMRES monitor on
        run: |
          sed -i 's#^  // ksm->setMonitor(new KSMPrintStdout("GMRES", 0, 1));#  ksm->setMonitor(new KSMPrintStdout("GMRES", 0, 1));#' src/TACSIntegrator.cpp
          grep -n 'ksm->setMonitor' src/TACSIntegrator.cpp
          make debug TACS_DIR=$TACS_DIR METIS_INCLUDE=-I${CONDA_PREFIX}/include/ METIS_LIB="-L${CONDA_PREFIX}/lib/ -lmetis" -j4 > /dev/null; make interface > /dev/null
      - name: Locate NaN
        run: |
          set +e +o pipefail
          lscpu | grep "Model name"; echo "avx512f cpus: $(grep -c avx512f /proc/cpuinfo)"
          cd $TACS_DIR
          for variant in "baseline" "TB_TOL=1e-12"; do
            echo "################ $variant"
            vars=""; [ "$variant" != baseline ] && vars="$variant"
            env $vars OPENBLAS_VERBOSE=2 mpirun -n 2 -x OPENBLAS_VERBOSE -x TB_TOL \
              python dbg_scripts/trans_beam_driver.py > /tmp/out_${variant//[^A-Za-z0-9]/_}.txt 2>&1
            grep -E "FUNC" /tmp/out_${variant//[^A-Za-z0-9]/_}.txt
            # context: Newton + GMRES lines leading into the first blow-up
            awk '/PERTURBED/{f=1} f' /tmp/out_${variant//[^A-Za-z0-9]/_}.txt | grep -nE "GMRES|^ *[0-9]+ +[-0-9.e+naNinf]+ |NaN" | grep -B60 -m1 -E "e\+[2-9][0-9]|nan" | tail -70
          done
