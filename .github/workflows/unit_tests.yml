name: Build, unit tests, and docs

# DEBUG workflow: locate the NaN in test_trans_beam's perturbed sinusoid solve on ubuntu-26.04.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,sm,tcp
      OMPI_MCA_rmaps_base_oversubscribe: 1
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    name: Debug trans_beam r${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          channels: conda-forge
          python-version: "3.11"
          conda-remove-defaults: true
      - name: Install TACS
        run: |
          export TACS_DIR=${GITHUB_WORKSPACE};
          echo "TACS_DIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV
          conda install -c conda-forge mamba -q -y;
          mamba install -c conda-forge pip;
          mamba install -c conda-forge sysroot_linux-64=2.17 -q -y;
          mamba install -c conda-forge openblas -q -y;
          mamba install -c conda-forge openmpi openmpi-mpicxx -q -y;
          mamba install -c conda-forge lapack -q -y;
          mamba install -c conda-forge metis=5.1.0 -q -y;
          cd $TACS_DIR;
          cp Makefile.in.info Makefile.in;
          make debug TACS_DIR=$TACS_DIR METIS_INCLUDE=-I${CONDA_PREFIX}/include/ METIS_LIB="-L${CONDA_PREFIX}/lib/ -lmetis" -j4;
          make interface;
          mamba install -c conda-forge "petsc>=3.19,!=3.22.3" petsc4py "numpy>=2" -q -y;
      - name: Locate NaN
        run: |
          set +e +o pipefail
          lscpu | grep "Model name"; echo "avx512f cpus: $(grep -c avx512f /proc/cpuinfo)"
          cd $TACS_DIR
          for variant in "baseline" "OPENBLAS_CORETYPE=Haswell" "OMP_NUM_THREADS=1"; do
            echo "################ $variant"
            vars=""; [ "$variant" != baseline ] && vars="$variant"
            env $vars OPENBLAS_VERBOSE=2 mpirun -n 2 -x OPENBLAS_VERBOSE -x OPENBLAS_CORETYPE -x OMP_NUM_THREADS \
              python dbg_scripts/trans_beam_driver.py 2>&1 | grep -vE "^\s*$" | grep -E "FUNC|Core:|####|NaN|failed|^ *[0-9]+ +[-0-9.e+naNinf]+ " | head -120
          done
