name: Build, unit tests, and docs

# DEBUG workflow: capture the exact CI build of TACS that produces the NaN in
# test_trans_beam's perturbed sinusoid solve, so it can be replayed locally.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,sm,tcp
      OMPI_MCA_rmaps_base_oversubscribe: 1
    defaults:
      run:
        shell: bash -l {0}
    name: Capture trans_beam build
    steps:
      - uses: actions/checkout@v7
      - name: Setup miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          channels: conda-forge
          python-version: "3.11"
          conda-remove-defaults: true
      - name: Install TACS
        run: |
          export TACS_DIR=${GITHUB_WORKSPACE};
          echo "TACS_DIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV
          mkdir -p $TACS_DIR/capture
          conda install -c conda-forge mamba -q -y;
          mamba install -c conda-forge pip;
          mamba install -c conda-forge sysroot_linux-64=2.17 -q -y;
          mamba install -c conda-forge openblas -q -y;
          mamba install -c conda-forge openmpi openmpi-mpicxx -q -y;
          mamba install -c conda-forge lapack -q -y;
          mamba install -c conda-forge metis=5.1.0 -q -y;
          conda list --explicit > $TACS_DIR/capture/env_at_build.txt
          cd $TACS_DIR;
          cp Makefile.in.info Makefile.in;
          make debug TACS_DIR=$TACS_DIR METIS_INCLUDE=-I${CONDA_PREFIX}/include/ METIS_LIB="-L${CONDA_PREFIX}/lib/ -lmetis" -j4 2>&1 | tee $TACS_DIR/capture/build_lib.log;
          make interface 2>&1 | tee $TACS_DIR/capture/build_interface.log;
          mamba install -c conda-forge "petsc>=3.19,!=3.22.3" petsc4py "numpy>=2" -q -y;
          conda list --explicit > $TACS_DIR/capture/env_at_run.txt
      - name: Record toolchain
        run: |
          set +e
          cd $TACS_DIR/capture
          {
            echo "CONDA_PREFIX=$CONDA_PREFIX"; uname -a; cat /etc/os-release | head -3
            echo "--- mpicxx"; which mpicxx; mpicxx --showme; mpicxx --version
            echo "--- g++"; which -a g++ c++; g++ --version
            echo "--- python"; which python; python -VV
            echo "--- ldd libtacs.so"; ldd $TACS_DIR/lib/libtacs.so
            echo "--- ldd TACS ext"; ldd $TACS_DIR/tacs/TACS*.so
            echo "--- env diff build->run"; diff env_at_build.txt env_at_run.txt
          } > toolchain.txt 2>&1
          cat toolchain.txt
      - name: Run driver
        run: |
          set +e +o pipefail
          lscpu | grep "Model name"
          cd $TACS_DIR
          OPENBLAS_VERBOSE=2 mpirun -n 2 -x OPENBLAS_VERBOSE python dbg_scripts/trans_beam_driver.py \
            > capture/driver_out.txt 2>&1
          grep -E "FUNC|Core:" capture/driver_out.txt
          grep -nE "^ *[0-9]+ +[-0-9.e+naNinf]+ |NaN" capture/driver_out.txt | grep -B12 -m1 -E "e\+[2-9][0-9]|nan"
      - name: Pack build tree
        run: |
          cd $TACS_DIR/..
          tar czf $RUNNER_TEMP/tacs_ci_build.tgz --exclude=tacs/.git tacs
          ls -la $RUNNER_TEMP/tacs_ci_build.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: tacs-ci-build
          path: ${{ runner.temp }}/tacs_ci_build.tgz
          retention-days: 7
